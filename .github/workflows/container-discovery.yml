name: Container Discovery

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mock-connections:
    name: Discover mocked connections in Docker
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Run containerized discovery acceptance test
        run: ./scripts/test-container-discovery.sh
