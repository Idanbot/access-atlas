[package]
name = "access-atlas"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first infrastructure access map and command catalog"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Idanbot/access-atlas"
keywords = ["tui", "infrastructure", "kubernetes", "ssh", "discovery"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
glam = "0.33.5"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.23.0"
