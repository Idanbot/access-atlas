[package]
name = "access-atlas"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Animated read-only topology demo for SSH and cloud access paths"
license = "MIT"
repository = "https://github.com/Idanbot/access-atlas"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
glam = "0.33.5"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
